[project]
name = "ufc-scraper"
version = "0.1.0"
description = "Scraper do UFC Stats: coleta HTML bruto e gera tabelas relacionais (events, fights, fight_stats, round_stats, fighters)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufc_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
